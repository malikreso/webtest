<table>
    <thead>
        <tr>
            <th>Datum</th>

```

</div>

<script>

// =====================================================
// Daten werden aus "obaveze.txt" geladen.
// Die Datei muss im gleichen Ordner wie index.html liegen.
// =====================================================

const datei = "obaveze.txt";

fetch(datei)
    .then(response => {

        if (!response.ok) {
            throw new Error("Datei obaveze.txt wurde nicht gefunden.");
        }

        return response.text();
    })

    .then(text => {

        const zeilen = text.split(/\r?\n/);
        const tabelle = document.getElementById("tabelle");

        zeilen.forEach(zeile => {

            zeile = zeile.trim();

            if (zeile === "") {
                return;
            }

            const teile = zeile.split("|");

            if (teile.length !== 2) {
                return;
            }

            const ersteSpalte = teile[0].trim();
            const zweiteSpalte = teile[1].trim();

            const tr = document.createElement("tr");

            if (
                ersteSpalte.toUpperCase() === "INSGESAMT" ||
                ersteSpalte.toUpperCase() === "ERLEDIGT"
            ) {
                tr.className = "summary";
            }

            const datum = document.createElement("td");
            const stunden = document.createElement("td");

            datum.textContent = ersteSpalte;
            stunden.textContent = zweiteSpalte;

            tr.appendChild(datum);
            tr.appendChild(stunden);

            tabelle.appendChild(tr);
        });

    })

    .catch(error => {

        document.getElementById("fehler").textContent =
            "Fehler: " + error.message;

    });

</script>

</body>
